# PR 校验(核心版,参照 deepseek-harness 的 .github/workflows/ci.yml)
# master 合并的校验以后单独放一个文件(如 ci-master.yml),不要塞进这里

name: CI

on:
  pull_request:

# 最小权限:校验流程只需要读仓库,不写
permissions:
  contents: read

# 同一个 workflow + 同一个 ref(分支)只保留最新一次运行,旧的直接取消
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PRIMARY_NODE_VERSION: '24'

jobs:
  check:
    name: ${{ matrix.os }} / node 24 / static & tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      # npm ci = 按 package-lock.json 精确安装(等价 pnpm 的 --frozen-lockfile)
      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

  # 裁决 job:分支保护只认一个稳定 check("all checks passed")。
  # 以后拆出更多 job,只往 needs 里加名字,不用改分支保护配置
  all-checks-passed:
    name: all checks passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [check]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    steps:
      - name: Fail if any needed job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::Needed job results: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - name: All checks passed
        run: echo "All needed jobs succeeded (${{ join(needs.*.result, ', ') }})"
